name: Build Installers

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install libusb

      - name: Find escpos path
        id: find_escpos
        run: |
          ESCPOS_PATH=$(python -c "import escpos; import os; print(os.path.dirname(escpos.__file__))")
          echo "ESCPOS_PATH=$ESCPOS_PATH" >> $GITHUB_OUTPUT

      - name: Build macOS app
        run: |
          pyinstaller --name "Glamiris Print Agent" \
            --windowed \
            --icon assets/icon.png \
            --add-data "assets:assets" \
            --add-data "${{ steps.find_escpos.outputs.ESCPOS_PATH }}:escpos" \
            --hidden-import pystray._darwin \
            --hidden-import PIL._tkinter_finder \
            --hidden-import usb.core \
            --hidden-import usb.util \
            --hidden-import usb.backend.libusb1 \
            --osx-bundle-identifier com.glamiris.printagent \
            tray_app.py

      - name: Fix app bundle for LSUIElement
        run: |
          # Add LSUIElement to hide from dock (menu bar app)
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "dist/Glamiris Print Agent.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "dist/Glamiris Print Agent.app/Contents/Info.plist" || true

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r "dist/Glamiris Print Agent.app" dmg_contents/
          hdiutil create -volname "Glamiris Print Agent" -srcfolder dmg_contents -ov -format UDZO GlamirisPrintAgent-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: GlamirisPrintAgent-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32 libusb
          # Run pywin32 post-install script to register COM objects
          python -c "import win32com.client" 2>$null || true

      - name: Download libusb DLL
        run: |
          # Download libusb for Windows
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z" -OutFile "libusb.7z"
          7z x libusb.7z -olibusb
          mkdir -p libusb_dll
          copy "libusb\VS2022\MS64\dll\libusb-1.0.dll" "libusb_dll\"

      - name: Find escpos capabilities.json
        id: find_caps
        run: |
          $escpos_path = python -c "import escpos; import os; print(os.path.dirname(escpos.__file__))"
          echo "ESCPOS_PATH=$escpos_path" >> $env:GITHUB_OUTPUT

      - name: Build Windows exe
        run: |
          $escpos_path = "${{ steps.find_caps.outputs.ESCPOS_PATH }}"
          pyinstaller --name "GlamirisPrintAgent" --onefile --windowed --icon assets/icon.png --add-data "assets;assets" --add-data "$escpos_path;escpos" --add-binary "libusb_dll\libusb-1.0.dll;." --hidden-import pystray._win32 --hidden-import PIL._tkinter_finder --hidden-import win32print --hidden-import win32api --hidden-import win32con --hidden-import pywintypes --hidden-import usb.core --hidden-import usb.util --hidden-import usb.backend.libusb1 tray_app.py

      - name: Rename executable
        run: |
          move dist\GlamirisPrintAgent.exe GlamirisPrintAgent-Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: GlamirisPrintAgent-Windows.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GlamirisPrintAgent-macOS.dmg
            GlamirisPrintAgent-Windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
